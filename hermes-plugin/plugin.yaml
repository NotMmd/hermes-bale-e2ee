name: bale-platform
label: Bale
kind: platform
version: 1.4.0
description: >
  Bale (بله) messaging gateway adapter for Hermes Agent with End-to-End Encryption (E2EE).
  Zero-leakage AES-256-GCM encryption for text and media.
  Full compatibility with Hermes media_urls/media_types caching, tools, slash commands, inline keyboards, compact long-message E2EE, clarify, and approval buttons.
author: NotMmd
emoji: "🟦"

requires_env:
  - name: BALE_BOT_TOKEN
    description: "Bale bot token from @Bot_Father"
    prompt: "Bale bot token"
    password: true

optional_env:
  - name: BALE_ENCRYPTION_KEY
    description: "Passphrase / Secret key for E2EE AES-256-GCM (leave empty for unencrypted mode)"
    prompt: "Encryption key or passphrase (optional, recommended)"
    password: true
  - name: BALE_ALLOWED_USERS
    description: "Comma-separated Bale chat IDs allowed to use the bot"
    prompt: "Allowed Bale chat IDs (comma-separated)"
    password: false
  - name: BALE_ALLOW_ALL_USERS
    description: "Allow any Bale chat to use the bot (true/false)"
    prompt: "Allow all Bale users? (true/false)"
    password: false
  - name: BALE_HOME_CHANNEL
    description: "Default Bale chat ID for cron / notification delivery"
    prompt: "Bale home channel/chat ID (or empty)"
    password: false
  - name: BALE_MAX_FILE_SIZE_MB
    description: "Maximum file transfer size in MB (default: 20)"
    prompt: "Max file size in MB"
    password: false
